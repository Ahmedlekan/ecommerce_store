# Source: retail-store-sample-orders-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: micro-tier
  name: orders
  labels:
    helm.sh/chart: orders-1.2.4
    app.kubernetes.io/name: orders
    app.kubernetes.io/instance: orders
    app.kubernetes.io/component: service
    app.kubernetes.io/owner: retail-store-sample
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1 # Runs one orders pod for simpler deployment.
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1 # Allows Kubernetes to create one extra orders pod during rolling updates for safer replacement.
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
      app.kubernetes.io/instance: orders
      app.kubernetes.io/component: service
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/instance: orders
        app.kubernetes.io/component: service
        app.kubernetes.io/owner: retail-store-sample
    spec:
      topologySpreadConstraints:
        # Spread across nodes within the same availability zone.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: orders

        # Spread across availability zones when multiple zones are available.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule # ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: orders
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      serviceAccountName: orders
      securityContext:
        fsGroup: 1000
      containers:
        - name: orders
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
            - name: OTEL_SERVICE_NAME
              value: orders
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_RESOURCE_PROVIDERS_AWS_ENABLED
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://adot-traces-collector.micro-tier.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage,xray
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            # Production option: use ratio-based sampling to reduce trace volume and cost.
            # - name: OTEL_TRACES_SAMPLER
            #   value: traceidratio
            # - name: OTEL_TRACES_SAMPLER_ARG
            #   value: "0.10"
          envFrom:
            - configMapRef:
                name: orders
          # Export the DB credentials from CSI-mounted files so the Spring app
          # keeps receiving the same env var names it previously got from Secrets.
          command: ["/bin/sh", "-c"]
          args:
            - |
              export RETAIL_ORDERS_PERSISTENCE_USERNAME="$(cat /mnt/secrets-store/RETAIL_ORDERS_PERSISTENCE_USERNAME)";
              export RETAIL_ORDERS_PERSISTENCE_PASSWORD="$(cat /mnt/secrets-store/RETAIL_ORDERS_PERSISTENCE_PASSWORD)";
              echo "Loaded orders database credentials from AWS Secrets Manager. Starting orders service.";
              exec java $JAVA_OPTS -jar /app/app.jar
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: "314146307160.dkr.ecr.us-east-1.amazonaws.com/ecommerce-store/orders:c58ef6e"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 256m
              memory: 512Mi
          volumeMounts:
            # Mount the Secrets Store CSI volume so the app can read DB
            # credentials from AWS Secrets Manager at startup.
            - name: aws-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        # The orders DB secret is mounted as files from AWS Secrets Manager.
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: orders-runtime-secrets
        - name: tmp-volume
          emptyDir:
            medium: Memory
