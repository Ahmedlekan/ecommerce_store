# Source: retail-store-sample-orders-chart/templates/configmap.yml
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: micro-tier
  name: orders
data:
  # Switch the orders app to the AWS-native SQS messaging provider.
  RETAIL_ORDERS_MESSAGING_PROVIDER: sqs
  # Replace this with the Terraform output orders_sqs_queue_name after apply.
  RETAIL_ORDERS_MESSAGING_SQS_TOPIC: retail-dev-orders-events
  RETAIL_ORDERS_PERSISTENCE_PROVIDER: postgres
  # Replace this with the Terraform output orders_postgresql_rds_endpoint after apply.
  RETAIL_ORDERS_PERSISTENCE_ENDPOINT: retail-dev-orders-postgresql.cyf2aa0ggkmv.us-east-1.rds.amazonaws.com:5432
  RETAIL_ORDERS_PERSISTENCE_NAME: orders
