# Source: retail-store-sample-catalog-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: micro-tier
  name: catalog
  labels:
    helm.sh/chart: catalog-1.2.4
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: service
    app.kubernetes.io/owner: retail-store-sample
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1 # Runs one catalog pod for simpler deployment.
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1 # Allows Kubernetes to create one extra catalog pod during rolling updates for safer replacement.
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
      app.kubernetes.io/component: service
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: service
        app.kubernetes.io/owner: retail-store-sample
    spec:
      topologySpreadConstraints:
        # Spread across nodes within the same availability zone.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: catalog

        # Spread across availability zones when multiple zones are available.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule # ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: catalog
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      serviceAccountName: catalog
      securityContext:
        fsGroup: 1000
      containers:
        - name: catalog
          envFrom:
            - configMapRef:
                name: catalog
          env:
            - name: OTEL_SERVICE_NAME
              value: catalog
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_RESOURCE_PROVIDERS_AWS_ENABLED
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://adot-traces-collector.micro-tier.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage,xray
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            # Production option: use ratio-based sampling to reduce trace volume and cost.
            # - name: OTEL_TRACES_SAMPLER
            #   value: traceidratio
            # - name: OTEL_TRACES_SAMPLER_ARG
            #   value: "0.10"
          command: ["/bin/sh", "-c"]
          args:
            - |
              export RETAIL_CATALOG_PERSISTENCE_USER="$(cat /mnt/secrets-store/MYSQL_USER)";
              export RETAIL_CATALOG_PERSISTENCE_PASSWORD="$(cat /mnt/secrets-store/MYSQL_PASSWORD)";
              echo "Loaded catalog database credentials from AWS Secrets Manager. Starting catalog service.";
              exec /app/main
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: "314146307160.dkr.ecr.us-east-1.amazonaws.com/ecommerce-store/catalog:c58ef6e"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 256m
              memory: 256Mi
          volumeMounts:
            - name: aws-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: catalog-db-secrets
        - name: tmp-volume
          emptyDir:
            medium: Memory
        
