# ExternalName keeps the in-cluster hostname `catalog-mysql` while routing DNS to RDS.
apiVersion: v1
kind: Service
metadata:
  name: catalog-mysql
  labels:
    helm.sh/chart: catalog-1.2.4
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: mysql
    app.kubernetes.io/owner: retail-store-sample
    app.kubernetes.io/managed-by: Helm
spec:
  type: ExternalName
  externalName: database-1.cyf2aa0ggkmv.us-east-1.rds.amazonaws.com
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
