apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Ahmedlekan/ecommerce_store.git
    targetRevision: main
    path: Kubernetes_manifest/aws_dataplane_k8manifest/01_catalog

  destination:
    server: https://kubernetes.default.svc
    namespace: micro-tier

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
