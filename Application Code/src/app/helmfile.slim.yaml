releases:
  - name: "catalog"
    namespace: "micro-tier"
    chart: ../catalog/chart
    wait: true
    values:
      - templates/components.yaml.gotmpl
      - templates/catalog.yaml.gotmpl

  - name: "ui"
    namespace: "micro-tier"
    chart: ../ui/chart
    wait: true
    timeout: 600
    values:
      - templates/components.yaml.gotmpl
      - templates/ui.yaml.gotmpl
      - templates/ingress.yaml.gotmpl
      - retail:
          ui:
            endpoints:
              catalog: http://catalog
