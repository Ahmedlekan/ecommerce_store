{{- if and .Values.secretStore.enabled .Values.secretStore.providerClass.create }}
# SecretProviderClass maps AWS Secrets Manager fields to mounted files for the app and MySQL pod.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "catalog.secretProviderClassName" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretStore.provider | quote }}
  parameters:
    # Pod Identity is the expected auth mode for this EKS-focused chart.
    usePodIdentity: {{ ternary "\"true\"" "\"false\"" .Values.secretStore.usePodIdentity }}
    objects: |
      - objectName: {{ .Values.secretStore.secretName | quote }}
        objectType: {{ .Values.secretStore.objectType | quote }}
        jmesPath:
          - path: {{ .Values.secretStore.keys.user | quote }}
            objectAlias: {{ .Values.secretStore.keys.user | quote }}
          - path: {{ .Values.secretStore.keys.password | quote }}
            objectAlias: {{ .Values.secretStore.keys.password | quote }}
{{- end }}
