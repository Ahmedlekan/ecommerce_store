{{- if .Values.serviceAccount.create }}
# Service account for the catalog application pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "catalog.serviceAccountName" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if and .Values.mysql.enabled .Values.mysql.serviceAccount.create }}
# Separate service account for the MySQL pod so Pod Identity can be scoped cleanly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "catalog.mysqlServiceAccountName" . }}
  labels:
    helm.sh/chart: {{ include "catalog.chart" . }}
    {{- include "catalog.mysqlSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: ecommerce-store
    app.kubernetes.io/environment: {{ .Values.environment.name | quote }}
  {{- with .Values.mysql.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
