# Map only the orders database credentials from AWS Secrets Manager into files
# so the app can keep reading them through the CSI-mounted volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  namespace: micro-tier
  name: orders-runtime-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "orders-db-secret"
        objectType: "secretsmanager"
        jmesPath:
          - path: "RETAIL_ORDERS_PERSISTENCE_USERNAME"
            objectAlias: "RETAIL_ORDERS_PERSISTENCE_USERNAME"
          - path: "RETAIL_ORDERS_PERSISTENCE_PASSWORD"
            objectAlias: "RETAIL_ORDERS_PERSISTENCE_PASSWORD"
