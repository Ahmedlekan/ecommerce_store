apiVersion: v1
kind: Pod
metadata:
  name: catalog-mysql-client
  namespace: micro-tier
spec:
  # Reuse the catalog service account so the pod gets the same Pod Identity access
  # that the catalog application uses for Secrets Manager.
  serviceAccountName: catalog
  restartPolicy: Never
  containers:
    - name: mysql-client
      image: mysql:8.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Client pod ready.";
          echo "Read credentials from /mnt/secrets-store when connecting.";
          sleep infinity
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
      env:
        # Keep the endpoint and database name aligned with the catalog app config.
        - name: MYSQL_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: catalog
              key: RETAIL_CATALOG_PERSISTENCE_ENDPOINT
        - name: MYSQL_DB
          valueFrom:
            configMapKeyRef:
              name: catalog
              key: RETAIL_CATALOG_PERSISTENCE_DB_NAME
      volumeMounts:
        # Mount the same Secrets Store CSI volume used by the app so this pod
        # can read MYSQL_USER and MYSQL_PASSWORD from files.
        - name: aws-secrets
          mountPath: /mnt/secrets-store
          readOnly: true
  volumes:
    # Expose the catalog Secrets Manager values through the SecretProviderClass.
    - name: aws-secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: catalog-db-secrets
