apiVersion: policy/v1 
kind: PodDisruptionBudget
metadata:
  name: catalog-pdb # Names the PDB for the catalog application workload.
  namespace: micro-tier # Places the PDB in the same namespace as the catalog Deployment.
spec: 
  minAvailable: 2
  selector: # Starts the pod selector that tells the PDB which pods it protects.
    matchLabels: # Matches pods with the same labels used by the catalog Deployment selector.
      app.kubernetes.io/name: catalog # Selects pods whose application name is catalog.
      app.kubernetes.io/instance: catalog # Selects pods from the catalog release instance.
      app.kubernetes.io/component: service # Selects only the service component pods.
      app.kubernetes.io/owner: retail-store-sample # Selects pods owned by the retail-store-sample application.
