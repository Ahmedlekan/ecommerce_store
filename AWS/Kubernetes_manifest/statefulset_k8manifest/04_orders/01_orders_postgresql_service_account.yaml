# Dedicated service account so the PostgreSQL pod can read DB credentials
# from AWS Secrets Manager through EKS Pod Identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: micro-tier
  name: orders-postgresql-sa
  labels:
    helm.sh/chart: orders-1.2.4
    app.kubernetes.io/name: orders
    app.kubernetes.io/instance: orders
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/owner: retail-store-sample
    app.kubernetes.io/managed-by: Helm
